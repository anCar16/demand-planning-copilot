[project]
name = "demand-planning-copilot"
version = "0.1.0"
description = "LLM-powered copilot to query a retail demand forecasting system in natural language."
readme = "README.md"
requires-python = ">=3.11"
# Core dependencies: only what is needed to explore the data.
dependencies = [
    "pandas",
    "pyarrow",
    "duckdb",
    "python-dotenv",
    "pydantic",
    "pyyaml",
]

# Optional groups, installed only when needed to save disk space:
#   uv sync --group notebooks --group api --group llm --group dev
[dependency-groups]
notebooks = ["ipykernel", "matplotlib"]
api = ["fastapi", "uvicorn"]
# "mcp" is imported by litellm.completion but not declared by litellm itself.
llm = ["litellm", "langgraph", "mcp"]
dev = ["pytest", "ruff", "httpx"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demand_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import sorting, bugbear, pyupgrade, simplify
select = ["E", "F", "I", "B", "UP", "SIM"]
