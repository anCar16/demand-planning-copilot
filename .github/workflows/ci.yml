name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --group api --group llm --group dev
      - name: Lint
        run: uv run ruff check src tests
      - name: Test
        # Tests that need the Kaggle data are skipped: the CSVs are not redistributed.
        run: uv run pytest
